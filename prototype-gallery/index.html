<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents Foundry · Interactive Prototype Gallery</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#e8ebff;background:#090d19;--panel:#141b2d;--line:#29324a;--muted:#9ba8c5;--accent:#9b8aff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e8bcff;outline-offset:3px}a{color:#bcb0ff}.layout{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:25px 16px;background:#101627}.brand{font-size:19px;font-weight:800;margin:0 10px 6px}.muted{color:var(--muted)}.sidebar p{font-size:12px;margin:0 10px 30px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b7c2dc;padding:13px;border-radius:10px;margin:5px 0}.nav[aria-current=page]{background:#30294e;color:#fff}.main{padding:28px clamp(18px,4vw,65px);max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;color:#b6a9ff;text-transform:uppercase;letter-spacing:.13em;font-weight:800}h1{font-size:clamp(27px,3vw,42px);margin:8px 0}h2{font-size:21px}p{line-height:1.6}.badge{display:inline-block;border:1px solid #534873;background:#302744;border-radius:30px;padding:7px 11px;font-size:12px;color:#e5dfff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin-top:25px}.card,.screen,.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:24px}.card{min-height:210px;display:flex;flex-direction:column;align-items:flex-start}.card h2{margin:13px 0 0}.card p{color:var(--muted);flex:1}.symbol{font-size:28px}.btn{border:1px solid #6557ad;background:#6d5bc4;color:white;border-radius:10px;padding:11px 16px;font-weight:700}.btn.secondary{background:#202a43;border-color:#3a4765}.btn:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.screen{margin-top:24px;min-height:390px}.screen-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.screen-body{padding-top:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{padding:18px}.stat strong{font-size:26px;display:block}.stat small{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.row:last-child{border:0}.pill{background:#273a46;color:#a4ead0;padding:5px 10px;border-radius:20px;font-size:12px}.notice{background:#302a45;border-left:3px solid #ae9afa;padding:14px;border-radius:6px;margin:16px 0}.error{background:#4b2935;border-color:#ff9aa9}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}input,select{background:#10192d;color:inherit;border:1px solid #4a5671;border-radius:8px;padding:11px;max-width:100%}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0;max-width:360px}.light{--panel:#fff;--line:#d7ddea;--muted:#52627c;color:#202944;background:#f4f6fc}.light .sidebar{background:#e9edfa}.light .nav{color:#26304a}.light .nav[aria-current=page]{color:#fff}.light input,.light select{background:white;color:#202944}.light .btn.secondary{background:#edf0fb;color:#202944}.light .notice{background:#eee8ff;color:#2d2850}.light .error{background:#ffe2e7;color:#622533}.light .pill{background:#def8ed;color:#17543d}.light .badge{color:#352663;background:#e9e0ff}.light a{color:#5641a6}footer{margin:35px 0;color:var(--muted);font-size:12px}@media(max-width:750px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:14px}.sidebar p{margin-bottom:8px}.sidebar nav{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.main{padding:20px}}
</style></head><body><div id="app" class="layout"><aside class="sidebar"><div class="brand">✦ Agents Foundry</div><p class="muted">Interactive design preview · simulated data</p><nav id="nav" aria-label="Prototype surfaces"></nav><div style="margin:25px 10px"><a href="https://github.com/Agents-Foundry/prototypes">View source repository ↗</a></div></aside><main class="main"><div class="top"><span class="badge">DESIGN PROTOTYPE · NOT PRODUCTION</span><div class="toolbar"><button class="btn secondary" id="theme">Toggle theme</button><button class="btn secondary" id="reset">Reset demo</button></div></div><div id="content" aria-live="polite"></div><footer>All people, counts, actions and outcomes are simulated. No real organization data, secrets, API calls, authorization enforcement or independent review is represented.</footer></main></div>
<script>
const surfaces=[
{id:'gallery',name:'Gallery',icon:'▦',desc:'Choose a product surface and follow a guided journey.'},
{id:'platform',name:'Platform Owner',icon:'◈',desc:'Manage SaaS organizations, health and governance.',steps:['Overview','Organization details','Governance review'],metrics:['24 organizations','99.9% simulated uptime','3 review items'],rows:['Codifyd · Active','Northstar Labs · Trial','Helix Systems · Review']},
{id:'admin',name:'Organization Admin',icon:'▤',desc:'Set up departments, teams, people and agent access.',steps:['Organization overview','Team configuration','Access review'],metrics:['8 departments','31 teams','126 members'],rows:['Engineering → QA Team','Engineering → Frontend Team','Operations → IT Team']},
{id:'employee',name:'Employee Desktop',icon:'✧',desc:'Delegate a task, review its progress and approve safely.',steps:['Workspace','Agent run','Approval checkpoint'],metrics:['5 assigned agents','2 active tasks','1 pending approval'],rows:['QA Agent · Regression preparation','Developer Agent · Code review','Release Agent · Sanity checklist']},
{id:'studio',name:'Agent Studio',icon:'◇',desc:'Design agent blueprints and inspect publishing checkpoints.',steps:['Blueprint catalog','Blueprint editor','Publish review'],metrics:['12 blueprints','4 draft versions','2 pending reviews'],rows:['QA Engineer · v2 draft','Frontend Engineer · v1','Release Assistant · v3 draft']}
];
const state={surface:'gallery',step:0,mode:'normal',approved:false,theme:'dark'};
const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(label,fn,secondary=false){return '<button class="btn '+(secondary?'secondary':'')+'" data-action="'+fn+'">'+escapeHtml(label)+'</button>'}
function render(){
 el('app').classList.toggle('light',state.theme==='light');
 el('nav').innerHTML=surfaces.map(s=>'<button class="nav" data-surface="'+s.id+'" '+(state.surface===s.id?'aria-current="page"':'')+'>'+s.icon+' &nbsp;'+s.name+'</button>').join('');
 const s=surfaces.find(x=>x.id===state.surface);
 if(s.id==='gallery'){el('content').innerHTML='<div class="eyebrow" style="margin-top:32px">Explore the experience</div><h1>One gallery. Four product surfaces.</h1><p class="muted">Select an application to navigate its example screens, trigger simulated states and understand the intended workflow.</p><div class="grid">'+surfaces.slice(1).map(x=>'<section class="card"><span class="symbol">'+x.icon+'</span><h2>'+x.name+'</h2><p>'+x.desc+'</p>'+btn('Explore prototype →','open:'+x.id)+'</section>').join('')+'</div>';return;}
 let step=s.steps[state.step];
 let status=state.mode==='offline'?'<div class="notice error" role="status"><strong>Offline simulation.</strong> Actions are unavailable until connectivity is restored. No remote action was attempted.</div>':state.mode==='denied'?'<div class="notice error" role="status"><strong>Access denied simulation.</strong> This role cannot complete the privileged operation.</div>':state.mode==='loading'?'<div class="notice" role="status">Loading simulated data…</div>':'';
 let body=state.step===0?'<div class="stats">'+s.metrics.map((m,i)=>'<div class="stat"><strong>'+escapeHtml(m.split(' ')[0])+'</strong><small>'+escapeHtml(m.substring(m.indexOf(' ')+1))+'</small></div>').join('')+'</div><h3>Recent activity</h3>'+s.rows.map(r=>'<div class="row"><span>'+escapeHtml(r)+'</span><span class="pill">Sample</span></div>').join(''):
 state.step===1?'<h3>'+escapeHtml(step)+'</h3><p class="muted">This screen illustrates an example state transition for the '+s.name+' experience.</p><label class="field">Example configuration<input id="example-input" value="Demo workspace" maxlength="60"></label><div class="row"><span>Policy state</span><span class="pill">Simulated</span></div><div class="row"><span>Audit visibility</span><span class="pill">Design intent</span></div>':
 '<h3>'+escapeHtml(step)+'</h3><p class="muted">Privileged transitions should require fresh authorization, explicit confirmation and auditable outcomes in production. This demo does not enforce them.</p><div class="notice">Review required · Example only · No actual approval is recorded</div>'+btn(state.approved?'Simulated confirmation recorded':'Simulate confirmation','confirm');
 el('content').innerHTML='<div class="eyebrow" style="margin-top:32px">'+s.name+' / '+(state.step+1)+' of 3</div><h1>'+escapeHtml(step)+'</h1><p class="muted">'+s.desc+'</p><div class="toolbar"><label for="mode">Scenario</label><select id="mode"><option value="normal">Normal</option><option value="loading">Loading</option><option value="offline">Offline</option><option value="denied">Permission denied</option></select></div><section class="screen"><div class="screen-head"><strong>'+s.icon+' &nbsp; '+s.name+'</strong><span class="badge">SCREEN '+(state.step+1).toString().padStart(2,'0')+' · CONCEPT</span></div><div class="screen-body">'+status+body+'</div><div class="actions">'+btn('← Previous','prev',true)+btn(state.step===2?'Return to gallery':'Next screen →','next')+btn('Restart journey','restart',true)+'</div></section><p class="muted">Journey: '+s.steps.map((x,i)=>(i===state.step?'<strong>'+x+'</strong>':x)).join(' → ')+'</p>';
 el('mode').value=state.mode;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action],[data-surface],#theme,#reset');if(!a)return;if(a.id==='theme')state.theme=state.theme==='dark'?'light':'dark';else if(a.id==='reset'){state.surface='gallery';state.step=0;state.mode='normal';state.approved=false}else if(a.dataset.surface){state.surface=a.dataset.surface;state.step=0;state.mode='normal';state.approved=false}else{const v=a.dataset.action;if(v.startsWith('open:')){state.surface=v.slice(5);state.step=0}else if(v==='prev')state.step=Math.max(0,state.step-1);else if(v==='next'){if(state.step===2){state.surface='gallery';state.step=0}else state.step++}else if(v==='restart'){state.step=0;state.mode='normal';state.approved=false}else if(v==='confirm')state.approved=true;}render()});
document.addEventListener('change',e=>{if(e.target.id==='mode'){state.mode=e.target.value;render()}});
render();
</script></body></html>
