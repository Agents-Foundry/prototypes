name: Prototype apps checks
on:
  pull_request:
    paths:
      - 'design-system/**'
      - 'platform-owner/app/**'
      - 'organization-admin/app/**'
      - 'employee-desktop/app/**'
      - 'agent-studio/app/**'
      - 'screen-registry/**'
      - 'scripts/check_apps.py'
      - 'scripts/build_screen_registry.py'
      - '.github/workflows/prototype-apps.yml'
  push:
    branches: [main]
    paths:
      - 'design-system/**'
      - 'platform-owner/app/**'
      - 'organization-admin/app/**'
      - 'employee-desktop/app/**'
      - 'agent-studio/app/**'
      - 'screen-registry/**'
      - 'scripts/check_apps.py'
      - 'scripts/build_screen_registry.py'
      - '.github/workflows/prototype-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static structure checks (IDs, links, forbidden APIs)
        run: python scripts/check_apps.py
      - name: Screen registry is current
        run: python scripts/build_screen_registry.py --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: design-system/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Smoke, keyboard and automated axe checks (simulated environment only)
        run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-apps-test-results
          path: |
            design-system/tests/playwright-report/
            design-system/tests/test-results/
          if-no-files-found: error
          retention-days: 14
