name: Prototype Gallery Pages
on:
  push:
    branches: [main]
    paths:
      - 'prototype-gallery/**'
      - 'design-system/**'
      - 'platform-owner/app/**'
      - 'organization-admin/app/**'
      - 'employee-desktop/app/**'
      - 'agent-studio/app/**'
      - '.github/workflows/prototype-gallery-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: prototype-gallery-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site (gallery, design system, four prototype apps)
        run: |
          mkdir -p _site
          cp -R prototype-gallery _site/prototype-gallery
          cp -R design-system _site/design-system
          rm -rf _site/design-system/tests
          for d in platform-owner organization-admin employee-desktop agent-studio; do
            mkdir -p "_site/$d"
            cp -R "$d/app" "_site/$d/app"
          done
          printf '%s' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=prototype-gallery/"><title>Agents Foundry prototypes</title><a href="prototype-gallery/">Open the prototype gallery</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
