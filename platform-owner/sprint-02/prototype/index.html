<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agents Foundry · Platform Owner (Design Prototype)</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;--bg:#f5f7fb;--ink:#182237;--sub:#4b5b71;--card:#fff;--line:#dfe5ef;--accent:#5c54df;--soft:#efeeff;--nav:#101827;--good:#087f5b;--warn:#a8650b}
body.dark{--bg:#0b1220;--ink:#e9efff;--sub:#c4d0df;--card:#172237;--line:#344257;--accent:#afa5ff;--soft:#292b4c;--good:#68d6aa;--warn:#f3c273;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9b92f5;outline-offset:3px}.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.side{background:var(--nav);color:#d4def0;padding:26px 14px}.brand{font-size:20px;font-weight:800;margin:0 10px 8px}.brand b{color:#b8a6ff}.scope{font-size:11px;letter-spacing:.11em;color:#9daac0;margin:0 10px 27px}.nav{width:100%;border:0;border-radius:9px;text-align:left;padding:13px 14px;margin:3px 0;background:transparent;color:#bfcce0}.nav[aria-current=page]{color:white;background:#383365}.nav:disabled{opacity:.5;cursor:not-allowed}.content{min-width:0}.header{min-height:74px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;flex-wrap:wrap}.header strong{font-size:13px}.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:11px}.work{padding:32px;max-width:1320px;margin:auto}.kicker{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--sub);font-weight:750}h1{font-size:31px;margin:8px 0}h2{font-size:18px;margin:0 0 18px}p{line-height:1.5}.lead{color:var(--sub);margin:0 0 28px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:21px;min-width:0;margin-bottom:16px}.statname{font-size:12px;color:var(--sub)}.statval{font-size:29px;font-weight:780;letter-spacing:-.04em;margin:10px 0 4px}.hint{color:var(--sub);font-size:12px}.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:15px;margin-top:17px}.line{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line);flex-wrap:wrap}.line:first-of-type{border-top:0}.label{font-size:14px;font-weight:690}.small{font-size:12px;color:var(--sub);margin-top:4px}.status{font-size:11px;border-radius:6px;padding:5px 9px;background:var(--soft);color:var(--accent);font-weight:700}.status.good{background:#e3f7ee;color:#065f46}.status.warn{background:#fff3dc;color:#794408}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--accent);color:white;font-weight:680}.btn.alt{border:1px solid var(--line);background:var(--card);color:var(--ink)}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:17px}.toolbar input{max-width:350px}.field{display:block;font-size:12px;font-weight:700;margin-bottom:16px}.field input,.field select,.toolbar input{display:block;width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:7px;background:var(--card);color:var(--ink)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.notice{border:1px solid var(--line);border-left:4px solid var(--accent);padding:14px;background:var(--soft);border-radius:9px;margin:20px 0;font-size:13px}.crumb{font-size:12px;color:var(--sub)}.footer{padding:20px 32px;color:var(--sub);font-size:11px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{padding:8px 12px;border-radius:8px;background:var(--soft);font-size:12px}.step.active{background:var(--accent);color:white}.tablewrap{overflow-x:auto}.table{border-collapse:collapse;width:100%;min-width:620px}.table th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);padding:15px 12px;border-bottom:1px solid var(--line)}.table td{padding:17px 12px;border-bottom:1px solid var(--line);font-size:13px}.table tr:last-child td{border:0}.subtle{color:var(--sub)}.empty{padding:35px;text-align:center;color:var(--sub)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:14px;min-width:0}.brand{margin-bottom:3px}.scope{margin-bottom:10px}.side nav{display:flex;max-width:100%;overflow-x:auto;gap:6px}.nav{white-space:nowrap;width:auto}.header{padding:15px}.work{padding:20px 14px}}@media(max-width:520px){.stats,.formgrid{grid-template-columns:1fr}.work{padding:17px 12px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><b>◆</b> Agents Foundry</div><div class="scope">PLATFORM OWNER · GLOBAL CONSOLE</div><nav id="nav" aria-label="Platform sections"></nav></aside><div class="content"><div class="header"><strong id="where">Platform / Overview</strong><div class="top-actions"><span class="pill">● Operator session · MFA verified (demo)</span><button class="btn alt" id="theme" type="button">Dark mode</button></div></div><main class="work" id="view" tabindex="-1"></main><div class="footer">Sprint 02 design prototype · Sample tenant data · All actions simulated · No live systems connected</div></div></div>
<script>
const tabs=[['overview','Overview'],['organizations','Organizations'],['provision','Provision Tenant'],['catalog','Agent Catalog'],['billing','Billing & Usage'],['security','Security & Audit'],['operations','Operations']];
let screen='overview',step=0,theme='light',tenantFilter='',draft={name:'',slug:'',region:'eu-west-1',plan:'Starter',admin:''},sent=false;
const mock=[{name:'Codifyd',region:'IN',plan:'Growth',status:'Active',users:84},{name:'Northwind Labs',region:'EU',plan:'Enterprise',status:'Onboarding',users:18},{name:'Aster Digital',region:'US',plan:'Starter',status:'Active',users:12},{name:'Vertex Works',region:'IN',plan:'Growth',status:'Suspended',users:31}];
const main=document.getElementById('view');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const header=(tag,title,lead)=>'<div class="kicker">'+tag+'</div><h1>'+title+'</h1><p class="lead">'+lead+'</p>';
const line=(title,subtitle,badge,kind='')=>'<div class="line"><div><div class="label">'+title+'</div><div class="small">'+subtitle+'</div></div><span class="status '+kind+'">'+badge+'</span></div>';
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>'<button class="nav" data-go="'+id+'" '+(id===screen?'aria-current="page"':'')+'>'+label+'</button>').join('');document.getElementById('where').textContent='Platform / '+tabs.find(x=>x[0]===screen)[1]; 
if(screen==='overview')main.innerHTML=header('PLT-002 / PLATFORM INTELLIGENCE','Operating overview','Cross-tenant operational health, without exposure to tenant conversations, secrets, or private content.')+'<div class="stats">'+[['Organizations','128','+7 in the past 30 days'],['Active tenants','121','4 onboarding · 3 suspended'],['Usage this month','$42,810','Illustrative, estimated'],['Open incidents','2','One requires review']].map(x=>'<div class="card"><div class="statname">'+x[0]+'</div><div class="statval">'+x[1]+'</div><div class="hint">'+x[2]+'</div></div>').join('')+'</div><div class="two"><div class="card"><h2>Recent organization activity</h2>'+line('Northwind Labs','Tenant provisioning request · 12 min ago','Pending approval')+line('Codifyd','Plan allowance updated · 1 hour ago','Completed','good')+line('Vertex Works','Tenant suspended · 4 hours ago','Restricted','warn')+'<button class="btn alt" data-go="organizations">View organizations →</button></div><div class="card"><h2>Operations requiring attention</h2>'+line('Model provider degradation','Elevated latency in EU region','Investigating','warn')+line('Two unresolved access reviews','Operator grants nearing expiration','Review')+line('Billing reconciliation','Estimate vs invoiced charges','Pending')+'</div></div>';
if(screen==='organizations'){const rows=mock.filter(x=>x.name.toLowerCase().includes(tenantFilter.toLowerCase()));main.innerHTML=header('PLT-003 / TENANT DIRECTORY','Organizations','Manage tenant lifecycle and organizational metadata. Tenant private data is not accessible here.')+'<div class="toolbar"><input aria-label="Filter organizations" id="filter" placeholder="Search organizations…" value="'+esc(tenantFilter)+'"><button class="btn" data-go="provision">+ Provision tenant</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Organization</th><th>Region</th><th>Plan</th><th>Users</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><strong>'+x.name+'</strong></td><td>'+x.region+'</td><td>'+x.plan+'</td><td>'+x.users+'</td><td><span class="status '+(x.status==='Active'?'good':x.status==='Suspended'?'warn':'')+'">'+x.status+'</span></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No matching organizations</div>')+'</div>';}
if(screen==='provision')main.innerHTML=header('PLT-005 / TENANT CREATION','Provision an organization','Guided, policy-aware onboarding. This demo does not create real tenants.')+'<div class="steps">'+['Organization','Region & plan','Admin invitation','Review'].map((x,i)=>'<span class="step '+(step===i?'active':'')+'">'+(i+1)+'. '+x+'</span>').join('')+'</div><div class="card">'+(step===0?'<h2>Organization identity</h2><label class="field">Organization legal/display name<input id="name" value="'+esc(draft.name)+'" placeholder="Example: Codifyd"></label><label class="field">Tenant URL slug<input id="slug" value="'+esc(draft.slug)+'" placeholder="example-company"></label>':step===1?'<h2>Region and subscription</h2><div class="formgrid"><label class="field">Deployment region<select id="region"><option value="eu-west-1" '+(draft.region==='eu-west-1'?'selected':'')+'>EU (illustrative)</option><option value="ap-south-1" '+(draft.region==='ap-south-1'?'selected':'')+'>India (illustrative)</option><option value="us-east-1" '+(draft.region==='us-east-1'?'selected':'')+'>US (illustrative)</option></select></label><label class="field">Plan<select id="plan">'+['Starter','Growth','Enterprise'].map(x=>'<option '+(draft.plan===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><div class="notice">Region selection affects data residency and must be confirmed before real provisioning.</div>':step===2?'<h2>Initial organization administrator</h2><label class="field">Administrator email<input id="admin" type="email" value="'+esc(draft.admin)+'" placeholder="admin@example.com"></label><div class="notice">Send a one-time invitation, never an initial shared password.</div>':'<h2>Review provisioning request</h2>'+line('Organization',esc(draft.name)+' · '+esc(draft.slug),'Draft')+line('Region and plan',esc(draft.region)+' · '+esc(draft.plan),'Review')+line('Tenant administrator',esc(draft.admin),'Invite pending')+'<div class="notice">Submitting only simulates an approval request. No tenant becomes Active without authoritative provisioning.</div>')+'<div class="actions">'+(step>0?'<button class="btn alt" id="back">Back</button>':'')+'<button class="btn" id="next">'+(step===3?'Request approval':'Continue')+'</button><button class="btn alt" id="reset">Cancel draft</button></div></div>'+(sent?'<div role="status" class="notice">Request recorded as <strong>Pending approval (simulation)</strong>. No tenant provisioned.</div>':'');
if(screen==='catalog')main.innerHTML=header('PLT-011 / VERSIONED BLUEPRINTS','Agent blueprint catalog','Control publishing and organizational availability without revealing tenant conversations.')+'<div class="stats">'+[['QA Engineer','v1.4','Published'],['Frontend Engineer','v0.9','Review'],['DevOps Engineer','v1.1','Staged rollout'],['HR Assistant','v0.7','Draft']].map(x=>'<div class="card"><div class="statname">'+x[0]+'</div><div class="statval" style="font-size:23px">'+x[1]+'</div><div class="status">'+x[2]+'</div></div>').join('')+'</div><div class="notice">Catalog listing is a design reference. Publishing, tenant rollout and rollback are not implemented.</div>';
if(screen==='billing')main.innerHTML=header('PLT-008–010 / COMMERCIAL','Billing and usage','Organization plans, entitlements and metered usage with estimated vs reconciled status.')+'<div class="stats">'+[['Monthly estimated usage','$42,810','Estimate'],['Reconciled charges','$39,260','Last settled period'],['Past-due accounts','3','Requires attention'],['Trial tenants','17','7 renew in 14 days']].map(x=>'<div class="card"><div class="statname">'+x[0]+'</div><div class="statval">'+x[1]+'</div><div class="hint">'+x[2]+'</div></div>').join('')+'</div><div class="card"><h2>Billing exceptions</h2>'+line('Aster Digital','Plan upgrade requested','Pending review')+line('Vertex Works','Invoice dispute · no tenant-data access','Investigating','warn')+'</div>';
if(screen==='security')main.innerHTML=header('PLT-013–014 / GOVERNANCE','Security and audit','Operator identity, policy posture and reviewable platform events.')+'<div class="two"><div class="card"><h2>Security posture</h2>'+line('Platform staff MFA','Privileged operators require MFA','Enforced','good')+line('Tenant secrets','No default platform-operator visibility','Restricted','good')+line('Support access','Customer authorization required','Scoped')+'</div><div class="card"><h2>Recent audit events</h2>'+line('Provisioning request reviewed','Scope: organization metadata','Recorded')+line('Permission grant expired','Time-limited support access','Revoked','good')+line('Blueprint change proposed','Version history retained','Review')+'</div></div>';
if(screen==='operations')main.innerHTML=header('PLT-015–018 / OPERATIONS','Incidents and support','Respond to provider issues and tenant support requests with least-privilege safeguards.')+'<div class="card"><h2>Operations queue</h2>'+line('INC-1027 · Provider latency','EU region · elevated latency','Investigating','warn')+line('SUP-231 · Admin locked out','Recovery requires identity verification','Needs review')+line('SEC-008 · Support scope request','Waiting for customer authorization','Pending')+'</div><div class="notice">No default operator impersonation, tenant credential access or production recovery actions are available in this prototype.</div>';
}
function save(){for(const k of ['name','slug','region','plan','admin']){const el=document.getElementById(k);if(el)draft[k]=el.value;}}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){screen=go.dataset.go;render();main.focus();return;}if(e.target.id==='theme'){document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode';return;}if(e.target.id==='next'){save();if(step===0&&(!draft.name.trim()||!/^[a-z0-9-]{3,}$/.test(draft.slug))){alert('Provide a name and a lowercase URL slug (at least three characters).');return;}if(step===2&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(draft.admin)){alert('Provide a valid administrator email.');return;}if(step===3)sent=true;else step++;render();return;}if(e.target.id==='back'){save();step--;render();return;}if(e.target.id==='reset'){draft={name:'',slug:'',region:'eu-west-1',plan:'Starter',admin:''};step=0;sent=false;render();}});
document.addEventListener('input',e=>{if(e.target.id==='filter'){tenantFilter=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('filter');i.focus();i.setSelectionRange(pos,pos);}});
render();
</script></body></html>
