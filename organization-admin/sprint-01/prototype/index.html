<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents Foundry — Sprint 01 UX prototype</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;color-scheme:light;--bg:#F7F9FC;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dfe5ee;--primary:#5148e5;--nav:#101827;--hover:#f0efff;--success:#087f5b;--danger:#b42318}
body.dark{color-scheme:dark;--bg:#0c1220;--card:#182235;--ink:#edf2fa;--muted:#a9b8cf;--line:#344258;--primary:#afa5ff;--nav:#080c16;--hover:#302f52;--success:#63d4a2;--danger:#ff9898}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}aside{background:var(--nav);color:white;padding:24px 14px}.logo{font-weight:800;font-size:20px;margin:0 8px 30px}.logo span{color:#ab9bff}aside small{display:block;color:#9baac2;margin:0 12px 25px}.navitem{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:10px;background:transparent;border:0;color:#b7c5db;margin:4px 0}.navitem[aria-current=page],.navitem:hover{background:#393366;color:#fff}main{min-width:0}.top{height:72px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:12px}.top button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 14px}.wrap{max-width:1160px;margin:auto;padding:34px}h1{font-size:30px;margin:0 0 9px}p{line-height:1.5}.subtitle{color:var(--muted);margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:23px;margin-bottom:16px}.card h2{font-size:19px;margin:0 0 16px}.card h3{font-size:16px;margin:0 0 10px}.card p{color:var(--muted);font-size:14px}.value{font-size:38px;font-weight:750;margin:14px 0 5px}.chip{color:var(--success);font-size:13px;font-weight:700}.action{background:var(--primary);color:white;border:1px solid transparent;border-radius:9px;padding:12px 17px;font-weight:650}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:15px 0}.row{border-bottom:1px solid var(--line);padding:17px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}.row:last-child{border-bottom:0}label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:15px 0}input,select{display:block;width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--card);color:var(--ink);margin-top:7px}input[type=checkbox]{width:auto;display:inline-block;margin-right:11px;accent-color:var(--primary)}.steps{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}.step{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 15px;font-size:13px}.step.on{background:var(--hover);border-color:var(--primary)}.banner{border-radius:9px;padding:14px;background:var(--hover);margin-bottom:20px}.error{color:var(--danger)}.success{color:var(--success)}.right{margin-left:auto}.muted{color:var(--muted)}.hidden{display:none}.focus:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9c91fa;outline-offset:2px}dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;max-width:500px;width:calc(100% - 32px);padding:27px}dialog::backdrop{background:#101827a8}dialog form{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.footer{font-size:12px;color:var(--muted);padding:28px 34px}.link{background:transparent;border:0;color:var(--primary);padding:4px}.status-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status-controls select{width:auto;margin:0;min-width:145px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{padding:12px}.logo{margin:0 0 10px}aside small{display:none}nav{display:flex;overflow:auto;gap:5px}.navitem{white-space:nowrap;width:auto}.top{padding:12px;height:auto;flex-wrap:wrap}.wrap{padding:24px 15px}.row{align-items:flex-start}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important}}
</style></head><body><div class="app"><aside><div class="logo"><span>◆</span> Agents Foundry</div><small>CODIFYD / ORGANIZATION ADMIN</small><nav id="nav" aria-label="Admin navigation"></nav></aside><main><header class="top"><span id="crumb">Organization / Dashboard</span><div class="status-controls"><label for="state" style="margin:0">Preview state</label><select id="state" aria-label="Preview state"><option value="default">Default</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error</option><option value="denied">No permission</option><option value="pending">Approval pending</option></select><button id="theme">Dark mode</button></div></header><div class="wrap" id="screen" aria-live="polite"></div><div class="footer">Design-only UX prototype · Sample organization/data · Sprint 01 · Not implementation-ready</div></main></div><dialog id="modal" aria-labelledby="modal-title"><h2 id="modal-title">Confirm action</h2><p id="modal-text"></p><form method="dialog"><button class="action secondary" value="cancel">Cancel</button><button class="action" value="confirm">Confirm</button></form></dialog>
<script>
'use strict';
const screens=[['ORG-001','Sign in','Secure administrator access'],['ORG-002','Welcome','Set up your organization'],['ORG-003','Organization details','Configure your company identity'],['ORG-004','Dashboard','Your AI workforce at a glance'],['ORG-005','Departments & teams','Organize human and AI employees'],['ORG-006','Roles & positions','Define responsibilities'],['ORG-007','AI employees','Manage your digital workforce'],['ORG-008','Choose blueprint','Select an approved AI employee template'],['ORG-009','Configure employee','Identity, manager and model'],['ORG-010','Capabilities','Grant only approved capabilities'],['ORG-011','Integrations','Connect authorized systems'],['ORG-012','Review activation','Check readiness before requesting activation'],['ORG-013','Activation result','Activation state and next steps']];
const navLabels=[['Dashboard',3],['Organization',4],['People',null],['AI Employees',6],['Integrations',null],['Policies',null],['Approvals',null],['Analytics',null],['Settings',null]];
let current=Number(new URLSearchParams(location.search).get('screen')||3),state='default',dark=false,activation='not-requested',wizardDraft=false;const screen=document.querySelector('#screen'),modal=document.querySelector('#modal'),nav=document.querySelector('#nav');
const b=(t,to,secondary=false)=>'<button class="action '+(secondary?'secondary':'')+'" data-go="'+to+'">'+t+'</button>';
const row=(left,right)=>'<div class="row"><span>'+left+'</span><span>'+right+'</span></div>';
const field=(title,value,type='text',required=true)=>'<label>'+title+'<input '+(required?'required ':'')+'type="'+type+'" value="'+value.replaceAll('"','&quot;')+'"></label>';
function mainContent(i){
switch(i){
case 0:return '<div class="card" style="max-width:550px;margin:auto"><h2>Welcome back</h2><form data-next="1">'+field('Work email','alex@codifyd.example','email')+field('Password','sample-password','password')+'<p class="muted">Demonstration only. No login is performed.</p><button class="action" type="submit">Continue securely →</button></form></div>';
case 1:return '<div class="card"><h2>Set up your workspace in five steps</h2>'+['Organization identity','Departments and teams','Connect approved tools','Set governance','Hire an AI employee'].map((x,j)=>row((j+1)+'. '+x,'Not started')).join('')+b('Start onboarding →',2)+'</div>';
case 2:return '<div class="card"><h2>Company profile</h2><form data-next="4">'+field('Organization name','Codifyd')+field('Industry','Software and technology')+field('Company size','51-200')+field('Timezone','Asia/Kolkata')+'<button class="action" type="submit">Save and continue →</button></form></div>';
case 3:return '<div class="grid">'+[['AI employees','03'],['Human employees','24'],['Active runs','12'],['Month to date','$142']].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="value">'+x[1]+'</div><span class="chip">Updated recently</span></div>').join('')+'</div><div class="grid"><div class="card"><h2>Recent activity</h2>'+['Regression suite completed','Defect submission needs approval','Bitbucket connector verified'].map(x=>row(x,'View →')).join('')+'</div><div class="card"><h2>Quick actions</h2>'+b('View organization',4)+' '+b('Hire AI employee',7,true)+'</div></div>';
case 4:return '<div class="card"><div class="toolbar"><h2>Organization tree</h2><button class="action" data-dialog="Create department" data-dialog-text="Create a department? This is a visual-only confirmation.">+ Department</button></div>'+['Engineering — 4 teams','  Platform — 6 employees','  Frontend — 5 employees','  Backend — 5 employees','Quality Assurance — 6 employees','Product — 8 employees'].map(x=>row(x,'⋯')).join('')+b('Review roles →',5)+'</div>';
case 5:return '<div class="card"><div class="toolbar"><h2>Defined roles</h2><button class="action" data-dialog="Create role" data-dialog-text="Draft a role? This will not save data.">+ Role</button></div>'+['QA Engineer','Code Reviewer','DevOps Engineer','Product Analyst','Engineering Manager'].map(x=>row(x,'View →')).join('')+'</div>';
case 6:return '<div class="card"><div class="toolbar"><h2>Employee directory</h2>'+b('+ Hire AI employee →',7)+'</div><label>Search employees<input placeholder="Employee name or team" id="filter"></label><div id="employees">'+['QA Engineer — Active','DevOps Engineer — Active','Code Reviewer — Onboarding','Product Analyst — Inactive'].map(x=>row(x,'⋯')).join('')+'</div></div>';
case 7:return '<div class="grid">'+[['QA Engineer','Testing, defect triage and release readiness'],['Code Reviewer','Pull-request and code quality'],['DevOps Engineer','Delivery and infrastructure'],['Frontend Developer','UI delivery and accessibility']].map(x=>'<div class="card"><h2>'+x[0]+'</h2><p>'+x[1]+'</p>'+b('Choose blueprint →',8)+'</div>').join('')+'</div>';
case 8:return '<div class="card"><h2>Employee configuration</h2><form data-next="9">'+field('Employee name','QA Engineer')+field('Department','Engineering')+field('Team','Quality Assurance')+field('Reports to','QA Manager')+field('Approved model provider','Organization provider')+'<button class="action" type="submit">Continue →</button></form></div>';
case 9:return '<div class="card"><h2>Approved capabilities</h2>'+['Test case generation','Browser testing','Defect drafting','Release sanity testing'].map(x=>'<label><input type="checkbox" checked>'+x+'</label>').join('')+'<h3>Optional capabilities</h3>'+['Performance checks','Visual regression','Accessibility checks'].map(x=>'<label><input type="checkbox">'+x+'</label>').join('')+b('Continue →',10)+'</div>';
case 10:return '<div class="grid">'+[['Jira','Connected'],['GitHub','Connected'],['Bitbucket','Not connected'],['Playwright','Ready'],['Slack','Not connected'],['Confluence','Not connected']].map(x=>'<div class="card"><h2>'+x[0]+'</h2><p>'+x[1]+'</p><button class="action secondary" data-dialog="Connector review" data-dialog-text="This is a UX sample only. Never enter real credentials into the prototype.">Configure</button></div>').join('')+'</div>'+b('Review setup →',11);
case 11:return '<div class="grid"><div class="card"><h2>Configuration summary</h2>'+[['Employee','QA Engineer'],['Team','Engineering / QA'],['Manager','QA Manager'],['Capabilities','4 core, optional configurable'],['Integrations','Jira, GitHub and Playwright']].map(x=>row(...x)).join('')+'</div><div class="card"><h2>Readiness checks</h2>'+['Identity reviewed','Policy permissions reviewed','Approved provider','Connection health','Budget limit'].map(x=>row(x,'✓')).join('')+'<div class="banner">Activation may require designated human approval.</div><button class="action" data-dialog="Request activation" data-dialog-text="Submit an activation request for review? This demonstration will show a sample outcome.">Request activation →</button></div></div>';
case 12:return '<div class="card" style="text-align:center;padding:60px"><h2>'+ (activation==='pending'?'◷ Approval pending':activation==='rejected'?'Activation rejected':activation==='failed'?'Provisioning failed':activation==='active'?'✓ AI employee active':'Activation not requested') +'</h2><p>'+({pending:'Request submitted for human approval. The AI employee cannot execute tasks.',rejected:'The reviewer rejected the request. Edit permissions and resubmit.',failed:'Provisioning failed. Review the failed checks before retrying.',active:'Demo only: activation explicitly simulated after approval.', 'not-requested':'Request activation from the review step.'}[activation])+'</p><div class="toolbar" style="justify-content:center">'+b('View workforce →',6,true)+' '+b('Review setup',11,true)+'</div><p class="muted">Illustrative workflow state only. No actual provisioning.</p></div>';
}}
function render(){current=Math.max(0,Math.min(12,current));const x=screens[current];nav.innerHTML=navLabels.map(([t,i])=>i===null?'<span class="navitem" aria-disabled="true" title="Planned for a later design sprint">'+t+' · Soon</span>':'<button class="navitem" '+(i===current?'aria-current="page"':'')+' data-go="'+i+'">'+t+'</button>').join('');document.querySelector('#crumb').textContent='Codifyd / '+x[1];let html='<h1>'+x[1]+'</h1><p class="subtitle">'+x[2]+' · '+x[0]+'</p>';if(current>=7&&current<=11)html+='<div class="steps">'+['Blueprint','Configure','Capabilities','Integrations','Review'].map((a,j)=>'<button data-go="'+(7+j)+'" class="step '+(current===7+j?'on':'')+'">'+(j+1)+'. '+a+'</button>').join('')+'</div>';if(state!=='default'){const messages={empty:'No records yet. Your organization can get started from the primary action.',loading:'Loading data… (illustrative; no network requests)',error:'Unable to load this section. Try again later.',denied:'Access restricted. Contact an organization administrator.',pending:'Approval is pending. Protected actions must not run until authorized.'};html+='<div role="status" class="banner '+(state==='error'||state==='denied'?'error':'')+'">'+messages[state]+'</div>'}if(state==='default'||state==='pending')html+=mainContent(current);else if(state==='empty')html+='<div class="card"><h2>No information to display</h2>'+b('Return to dashboard',3)+'</div>';screen.innerHTML=html;history.replaceState(null,'','?screen='+current)}
document.addEventListener('click',e=>{const goto=e.target.closest('[data-go]');if(goto){current=+goto.dataset.go;state='default';document.querySelector('#state').value=state;render();return}const dialogButton=e.target.closest('[data-dialog]');if(dialogButton){document.querySelector('#modal-title').textContent=dialogButton.dataset.dialog;document.querySelector('#modal-text').textContent=dialogButton.dataset.dialogText;modal.showModal();}});
modal.addEventListener('close',()=>{if(modal.returnValue==='confirm'&&current===11){activation='pending';current=12;state='default';document.querySelector('#state').value='default';render()}});
document.addEventListener('submit',e=>{if(e.target.matches('form[data-next]')){e.preventDefault();if(!e.target.reportValidity())return;current=+e.target.dataset.next;render();}});
document.querySelector('#state').addEventListener('change',e=>{state=e.target.value;if(current===12){activation=state==='error'?'failed':state==='denied'?'rejected':state==='pending'?'pending':activation}render()});document.querySelector('#theme').addEventListener('click',()=>{dark=!dark;document.body.classList.toggle('dark',dark);document.querySelector('#theme').textContent=dark?'Light mode':'Dark mode'});
render();
</script></body></html>
